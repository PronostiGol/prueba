<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generar Quiniela</title>
<style>
:root{
  --bg:#0b0f14;
  --card:#151a21;
  --accent:#00ff87;
  --text:#eaeaea;
  --muted:#8a8f98;
}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header{
  padding:20px;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{margin:0;color:var(--accent);}
header button{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  background:var(--accent);
  transition:0.3s;
}
header button:hover{background:#00d77f;}

main{
  padding:20px;
  max-width:800px;
  margin:auto;
}

.input-card{
  margin-bottom:20px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.input-card label{
  font-size:14px;
  color:var(--accent);
  font-weight:bold;
}

.input-card input{
  padding:10px;
  border-radius:8px;
  border:2px solid #151a21;
  background:#151a21;
  color:#fff;
  font-size:14px;
  transition:0.3s, border-color 0.3s;
}

.input-card input.valid{
  border-color:#00ff87;
}

.input-card input.invalid{
  border-color:#ff6b6b;
}

.input-card .helper-text{
  font-size:12px;
  color:var(--muted);
  font-style:italic;
}

.partido-card{
  background: rgba(21,26,33,0.8);
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  transition:0.3s, transform 0.3s;
}
.partido-card:hover{
  background: rgba(31,35,45,0.9);
  transform: scale(1.02);
}

select{
  padding:8px;
  border-radius:8px;
  border:none;
  background:#151a21;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}
select:hover{background:#1f1f1f;}

button#guardar{
  padding:12px 20px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  background:linear-gradient(135deg,#00ff87,#00d77f);
  cursor:pointer;
  margin-top:20px;
  font-size:16px;
  color:#000;
  transition:0.3s, transform 0.3s;
}
button#guardar:hover:enabled{
  background:linear-gradient(135deg,#00d77f,#00ff87);
  transform:scale(1.05);
}
button#guardar:disabled{
  opacity:0.5;
  cursor:not-allowed;
}
</style>
</head>
<body>
<header>
<h1>Generar Quiniela</h1>
<button onclick="location.href='index.html'">Volver a tabla</button>
</header>

<main>
  <!-- Nombre de usuario -->
  <div class="input-card">
    <label for="usuarioInput">Nombre del Usuario:</label>
    <input type="text" id="usuarioInput" placeholder="Ingresa tu nombre..."/>
  </div>

  <!-- Formulario de partidos -->
  <form id="quinielaForm"></form>

  <!-- CLABE Interbancaria -->
  <div class="input-card">
    <label for="clabeInput">CLABE Interbancaria (18 dígitos):</label>
    <input type="text" id="clabeInput" placeholder="123456789012345678" maxlength="18"/>
    <span class="helper-text">Este dato es obligatorio para depositar el premio en caso de resultar ganador.</span>
  </div>

  <button id="guardar" disabled>Guardar Quiniela</button>
</main>

<script>
// Datos de partidos
const partidos = JSON.parse(localStorage.getItem("partidos")) || [];
const form = document.getElementById("quinielaForm");

// Crear campos para cada partido
partidos.forEach((p,index)=>{
  const div = document.createElement("div");
  div.className="partido-card";
  div.innerHTML=`
    <span>${p.local} vs ${p.visitante}</span>
    <select data-index="${index}" class="pick-select">
      <option value="">Elegir</option>
      <option value="L">${p.local}</option>
      <option value="V">${p.visitante}</option>
      <option value="E">Empate</option>
    </select>
  `;
  form.appendChild(div);
});

// Inputs y botón
const clabeInput = document.getElementById("clabeInput");
const usuarioInput = document.getElementById("usuarioInput");
const guardarBtn = document.getElementById("guardar");
const pickSelects = () => document.querySelectorAll(".pick-select");

// Función para validar campos y habilitar botón
function validarCampos(){
  const usuarioValido = usuarioInput.value.trim().length > 0;
  const clabeValida = /^\d{18}$/.test(clabeInput.value.trim());
  const picksValidos = Array.from(pickSelects()).every(s=>s.value !== "");
  if(usuarioValido) usuarioInput.classList.add("valid"); else usuarioInput.classList.remove("valid");
  clabeInput.classList.toggle("valid", clabeValida);
  clabeInput.classList.toggle("invalid", !clabeValida && clabeInput.value.length>0);
  guardarBtn.disabled = !(usuarioValido && clabeValida && picksValidos);
}

// Escuchar cambios en inputs
usuarioInput.addEventListener("input", validarCampos);
clabeInput.addEventListener("input", validarCampos);
form.addEventListener("change", validarCampos);

// Guardar quiniela
guardarBtn.addEventListener("click", ()=>{
  const usuario = usuarioInput.value.trim();
  const clabe = clabeInput.value.trim();
  const picks = Array.from(pickSelects()).map(s=>s.value);

  const quinielas = JSON.parse(localStorage.getItem("quinielas")) || [];
  quinielas.push({usuario,picks,clabe});
  localStorage.setItem("quinielas", JSON.stringify(quinielas));
  alert("Quiniela guardada!");
  location.href="index.html";
});
</script>
</body>
</html>
